{% extends "base.html" %}

{% block content %}

<h2 class="page-title mb-4">시간표 & 졸업요건</h2>

<div class="row">

    <!-- =======================
            시간표
    ======================== -->

    <div class="col-lg-8">

        <div class="card shadow-sm mb-4">

            <div class="card-header">

                <strong>시간표</strong>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered text-center align-middle" id="scheduleTable">

                        <thead>

                            <tr id="timeHeader">

                                <th style="width:90px;">시간</th>

                            </tr>

                        </thead>

                        <tbody id="scheduleBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <!-- =======================
            오른쪽
    ======================== -->

    <div class="col-lg-4">

        <!-- 강의 목록 -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">

                <strong>강의 목록</strong>

            </div>

            <div class="card-body">

                <input type="text" class="form-control mb-3" placeholder="강의 검색">

                <div id="courseList">

                    <p class="text-muted">

                        아직 강의가 없습니다.

                    </p>

                </div>

            </div>

        </div>


        <!-- 위험 알림 -->

        <div class="card shadow-sm">

            <div class="card-header">

                <strong>시간표 위험 알림</strong>

            </div>

            <div class="card-body">

                <div id="warningArea">

                    <span class="badge bg-success">

                        이상 없음

                    </span>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =======================
      졸업요건
======================= -->

<div class="card shadow-sm mt-4">

    <div class="card-header">

        <strong>졸업요건</strong>

    </div>

    <div class="card-body">

        <p>전공</p>

        <div class="progress mb-3">

            <div class="progress-bar" style="width:0%;">

                0%

            </div>

        </div>

        <p>교양</p>

        <div class="progress mb-3">

            <div class="progress-bar bg-success" style="width:0%;">

                0%

            </div>

        </div>

        <p>총 학점</p>

        <div class="progress">

            <div class="progress-bar bg-warning" style="width:0%;">

                0%

            </div>

        </div>

    </div>

</div>

{% endblock %}
