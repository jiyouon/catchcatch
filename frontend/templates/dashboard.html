{% extends "base.html" %}

{% block content %}

<!-- <새로 작성> 상단 졸업요건 대시보드 & Care System 경고 알림 -->
<div class="row g-3 mb-4">
    <!-- 졸업요건 프로그레스 바 영역 -->
    <div class="col-12">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">🎓 졸업요건 이수 현황</h5>
                    <!-- Care System 뱃지 출력 공간 -->
                    <div id="careSystemBadges" class="d-flex gap-2 flex-wrap"></div>
                </div>

                <div class="row g-3">
                    <!-- 총 학점 게이지 -->
                    <div class="col-md-3">
                        <small class="text-muted d-block mb-1">총 학점 (<span id="totalCreditText">0 / 0</span>)</small>
                        <div class="progress" style="height: 22px;">
                            <div id="totalProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" 
                                 role="progressbar" style="width: 0%; transition: width 0.6s ease;">0%</div>
                        </div>
                    </div>
                    <!-- 전공 게이지 -->
                    <div class="col-md-3">
                        <small class="text-muted d-block mb-1">주전공 학점 (<span id="majorCreditText">0 / 0</span>)</small>
                        <div class="progress" style="height: 22px;">
                            <div id="majorProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" 
                                 role="progressbar" style="width: 0%; transition: width 0.6s ease;">0%</div>
                        </div>
                    </div>
                    <!-- 교양 게이지 -->
                    <div class="col-md-3">
                        <small class="text-muted d-block mb-1">교양 학점 (<span id="generalCreditText">0 / 0</span>)</small>
                        <div class="progress" style="height: 22px;">
                            <div id="generalProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-info" 
                                 role="progressbar" style="width: 0%; transition: width 0.6s ease;">0%</div>
                        </div>
                    </div>
                    <!-- 진로소양 게이지 -->
                    <div class="col-md-3">
                        <small class="text-muted d-block mb-1">진로소양 학점 (<span id="careerCreditText">0 / 0</span>)</small>
                        <div class="progress" style="height: 22px;">
                            <div id="careerProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-warning text-dark" 
                                 role="progressbar" style="width: 0%; transition: width 0.6s ease;">0%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <!-- 시간표 그리드 -->
    <div class="col-lg-8">
        <div class="card shadow-sm mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>🗓️ 내 시간표 (8시 ~ 20시)</strong>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered text-center align-middle" id="scheduleTable">
                        <thead>
                            <tr id="timeHeader">
                                <th style="width:80px;">시간</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 오른쪽: 강의 검색 및 목록 -->
    <div class="col-lg-4">
        <div class="card shadow-sm mb-4">
            <div class="card-header">
                <strong>🔍 강의 검색 및 추가</strong>
            </div>
            <div class="card-body">
                <input type="text" id="courseSearchInput" class="form-control mb-3" placeholder="강의명, 교수명 검색">
                <div id="courseList" style="max-height: 520px; overflow-y: auto;">
                    <p class="text-muted">강의 목록을 불러오는 중...</p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
