<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchCatch - 수강신청 & 졸업요건 스마트 케어</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 커스텀 스타일시트 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <!-- 네비게이션 바 (보라색 main-navbar 스타일 보존) -->
  <nav class="navbar navbar-expand-lg navbar-dark main-navbar shadow-sm">
    <div class="container-fluid px-4">

      <!-- 로고 (클릭 시 홈으로 이동) -->
      <a class="navbar-brand fw-bold fs-4" href="/">CatchCatch</a>

      <!-- 모바일 반응형 토글 버튼 -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <!-- [1] 왼쪽 주요 서비스 이동 메뉴 -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2 ms-3">
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="/dashboard">🗓️ 시간표 대시보드</a>
          </li>
          <li class="nav-item">
            <!-- 💡 졸업요건 진단/계산기 페이지 바로가기 -->
            <a class="nav-link fw-semibold" href="/graduation">🎓 졸업요건 계산기</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="/simulator">⚡ 수강신청 시뮬레이터</a>
          </li>
        </ul>

        <!-- [2] 오른쪽 사용자 로그인/내 정보 상태 메뉴 -->
        <ul class="navbar-nav ms-auto align-items-center gap-2">

          {% if session.get('user_id') %}

          <!-- 로그인 상태 -->
          <li class="nav-item">
            <span class="nav-link welcome-text text-light me-2">
              👋 <strong>{{ session.get('user_id') }}</strong>님 환영합니다!
            </span>
          </li>

          <li class="nav-item">
            <a class="btn btn-outline-light btn-sm rounded-pill px-3" href="/mypage">
              👤 내 정보
            </a>
          </li>

          <li class="nav-item">
            <button type="button" class="btn btn-danger btn-sm rounded-pill px-3" id="logoutNavBtn">
              로그아웃
            </button>
          </li>

          {% else %}

          <!-- 로그아웃 상태 -->
          <li class="nav-item">
            <a class="btn btn-outline-light btn-sm rounded-pill px-3" href="/login">
              로그인
            </a>
          </li>

          <li class="nav-item">
            <a class="btn btn-light btn-sm rounded-pill px-3 text-primary fw-bold" href="/register">
              회원가입
            </a>
          </li>

          {% endif %}

        </ul>
      </div>

    </div>
  </nav>

  <!-- 메인 컨텐츠 영역 -->
  <main class="container mt-4 mb-5">
    {% block content %}
    {% endblock %}
  </main>

  <!-- 푸터 -->
  <footer class="bg-light text-center py-4 mt-auto border-top">
    <p class="text-muted mb-0 small">© 2026 CatchCatch Project. All rights reserved.</p>
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 스크립트 파일들 -->
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
  <script src="{{ url_for('static', filename='schedule.js') }}"></script>
  <script src="{{ url_for('static', filename='graduation.js') }}"></script>

  <!-- 로그아웃 버튼 이벤트 리스너 -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const logoutBtn = document.getElementById("logoutNavBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async function () {
          try {
            const res = await fetch("/api/logout", {
              method: "POST",
              credentials: "same-origin"
            });
            const data = await res.json();
            if (data.success) {
              alert("로그아웃 되었습니다.");
              window.location.href = "/login";
            }
          } catch (err) {
            console.error("로그아웃 오류:", err);
            window.location.href = "/login";
          }
        });
      }
    });
  </script>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
  <script src="{{ url_for('static', filename='schedule.js') }}"></script>
  <script src="{{ url_for('static', filename='graduation.js') }}"></script>
  <script src="{{ url_for('static', filename='simulator.js') }}"></script>

</body>

</html>
