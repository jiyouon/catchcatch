{% extends "base.html" %}

{% block content %}

<div class="auth-card">

  <h2 class="page-title">회원가입</h2>

  <!-- 에러메시지 -->
  <div id="registerError" class="text-danger mb-3"></div>

  <form id="registerForm" autocomplete="on">

    <div class="mb-3">
      <label class="form-label">아이디</label>
      <input id="userId" type="text" class="form-control" placeholder="아이디" required>
      <div class="form-text">아이디는 4~20자, 영문/숫자/밑줄(_)만 허용됩니다.</div>
    </div>

    <div class="mb-3">
      <label class="form-label">비밀번호</label>
      <input id="password" type="password" class="form-control" placeholder="비밀번호" autocomplete="new-password" required>
      <div class="form-text">비밀번호는 8~32자, 영문/숫자/특수문자 중 2가지 이상을 포함해야 합니다.</div>
    </div>

    <div class="mb-3">
      <label class="form-label">비밀번호 확인</label>
      <input id="passwordCheck" type="password" class="form-control" placeholder="비밀번호를 다시 입력하세요" required>
    </div>

    <div class="mb-3">
      <label class="form-label">학번</label>
      <input id="studentId" type="text" class="form-control" placeholder="20261234" required>
      <div class="form-text">학번은 숫자 8~20자리로 입력해주세요.</div>
    </div>

    <div class="mb-3">

      <label class="form-label">
        학과
      </label>

      <select id="department" class="form-select" required>

        <option value="">선택</option>

        <option>컴퓨터공학과</option>

      </select>

    </div>

    <button class="btn btn-success w-100" type="submit">

      회원가입

    </button>

  </form>

  <hr>

  <p class="text-center">

    이미 계정이 있으신가요?

    <a href="/login">

      로그인

    </a>

  </p>

</div>

{% endblock %}
