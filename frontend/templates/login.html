{% extends "base.html" %}

{% block content %}

<div class="auth-card">

  <h2 class="page-title">로그인</h2>

  <!-- 로그인 실패 에러메시지 -->
  <div id="loginError" class="text-danger mb-3"></div>

  <form id="loginForm" autocomplete="on">

    <div class="mb-3">
      <label class="form-label">아이디</label>
      <input type="text" class="form-control" id="userId" placeholder="아이디를 입력하세요" autocomplete="username" required>
      <div class="form-text">아이디는 4~20자, 영문/숫자/밑줄(_)만 허용됩니다.</div>
    </div>

    <div class="mb-3">
      <label class="form-label">비밀번호</label>
      <input type="password" class="form-control" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
      <div class="form-text">비밀번호는 8~32자, 영문/숫자/특수문자 중 2가지 이상을 포함해야 합니다.</div>
    </div>

    <div class="mb-3 form-check">
      <input class="form-check-input" type="checkbox" id="rememberMe">

      <label class="form-check-label">
        로그인 상태 유지
      </label>
    </div>

    <button class="btn btn-primary w-100" type="submit">
      로그인
    </button>

  </form>

  <hr>

  <p class="text-center">

    계정이 없으신가요?

    <a href="/register">
      회원가입
    </a>

  </p>

</div>

{% endblock %}
